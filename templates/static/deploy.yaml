apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: app
spec:
  values:
    controllers:
      app:
        containers:
          app:
            command:
              - nginx
              - -g
              - daemon off;
            image:
              repository: nginx
              tag: 1.31.8-alpine3.24
            probes:
              liveness:
                enabled: true
                path: /health
                port: 8080
                type: HTTP
              readiness:
                enabled: true
                path: /health
                port: 8080
                type: HTTP
            resources:
              limits:
                memory: 64Mi
              requests:
                cpu: 5m
                memory: 16Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
    persistence:
      script:
        name: mini-tool-script
        type: configMap
        globalMounts:
          - path: /www/app.js
            readOnly: true
            subPath: app.js
      source:
        name: mini-tool-source
        type: configMap
        globalMounts:
          - path: /etc/nginx/nginx.conf
            readOnly: true
            subPath: nginx.conf
          - path: /www/app.css
            readOnly: true
            subPath: app.css
          - path: /www/index.html
            readOnly: true
            subPath: index.html
          - path: /www/third-party-licences.txt
            readOnly: true
            subPath: third-party-licences.txt
      temporary:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      private:
        annotations:
          gethomepage.dev/description: Text Counter
          gethomepage.dev/icon: mdi-text-box-outline
          gethomepage.dev/name: "Minilab: Text Counter"
    service:
      app:
        controller: app
        ports:
          http:
            port: 8080
---
apiVersion: v1
kind: Namespace
metadata:
  name: mini-tool
  labels:
    gateway.excloo.dev/private-access: "true"
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app
spec:
  egress: []
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8080
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: app
  policyTypes:
    - Egress
    - Ingress
