name: Check

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: check-${{ github.ref }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Shared Tools & Tasks
        uses: maxexcloo/dotfiles/.github/actions/mise@main
        with:
          project-tools: true
          tools: actionlint node@24 node@26 npm:renovate oxfmt
      - name: Install Dependencies
        run: npm ci
      - name: Run Checks
        run: mise run check

  publish:
    name: Publish
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Shared Tools & Tasks
        uses: maxexcloo/dotfiles/.github/actions/mise@main
        with:
          project-tools: true
          tools: node@26
      - name: Install Dependencies
        run: npm ci
      - name: Build Bundles
        run: mise run build
      - name: Log In to GHCR
        uses: docker/login-action@v4
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - name: Publish Artifact
        run: >-
          flux push artifact "oci://ghcr.io/$GITHUB_REPOSITORY:main" --path=.
          --add-ignore-paths=node_modules/
          --revision="$GITHUB_REF_NAME@sha1:$GITHUB_SHA"
          --source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
