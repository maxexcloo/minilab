apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - release.yaml
configurations:
  - name-reference.yaml
patches:
  # The target selects every HelmRelease; the patch's name is a placeholder.
  - target:
      kind: HelmRelease
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: application
      spec:
        interval: 30m
        chart:
          spec:
            chart: app-template
            interval: 24h
            sourceRef:
              kind: HelmRepository
              name: bjw-s
              namespace: flux-system
            # renovate: datasource=github-releases depName=bjw-s-labs/helm-charts extractVersion=^app-template-(?<version>.+)$
            version: 5.3.0
        serviceAccountName: minilab
        values:
          route:
            private:
              annotations:
                gethomepage.dev/enabled: "true"
                gethomepage.dev/group: Minilab
                gethomepage.dev/href: https://app.invalid
              hostnames:
                - app.${MINILAB_DOMAIN}
              parentRefs:
                - name: private
                  namespace: networking
                  sectionName: websecure
replacements:
  - source:
      kind: Namespace
      fieldPath: metadata.name
    targets:
      - select:
          kind: HelmRelease
        fieldPaths:
          - metadata.name
          - spec.releaseName
          - spec.values.global.nameOverride
          - spec.values.route.private.labels.[app.kubernetes.io/name]
        options:
          create: true
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.route.private.hostnames.0
        options:
          delimiter: .
          index: 0
      - select:
          kind: Namespace
        fieldPaths:
          - metadata.labels.[app.kubernetes.io/name]
        options:
          create: true
      - select:
          kind: NetworkPolicy
        fieldPaths:
          - metadata.name
          - spec.podSelector.matchLabels.[app.kubernetes.io/name]
        options:
          create: true
  - source:
      kind: HelmRelease
      fieldPath: spec.values.route.private.hostnames.0
    targets:
      - select:
          kind: HelmRelease
        fieldPaths:
          - spec.values.route.private.annotations.[gethomepage.dev/href]
        options:
          delimiter: /
          index: 2
