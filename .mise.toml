[env]
_.path = ["node_modules/.bin"]

[tools]
kubectl = "latest"

# Development
[tasks.build]
description = "Build Each App's Browser Bundle"
run = '''
set -eu
for web in apps/*/web templates/*/web; do
  vite build --config vite.config.ts --logLevel warn "$web"
done
'''

[tasks.check]
depends = [
  "check:build",
  "check:manifests",
  "check:mise",
  "check:oxfmt",
  "check:oxlint",
  "check:typescript",
  "check:updates",
  "check:whitespace",
  "test",
]

[tasks."check:build"]
description = "Check Committed Bundles Match Their Source"
run = '''
set -eu
built=$(mktemp -d)
trap 'rm -r "$built"' EXIT
for web in apps/*/web templates/*/web; do
  vite build --config vite.config.ts --logLevel warn --outDir "$built/$web" "$web"
  diff -r "$built/$web" "${web%/web}/dist"
done
'''

[tasks."check:manifests"]
run = '''
kubectl kustomize clusters/syd > /dev/null
kubectl kustomize templates/static > /dev/null
'''

[tasks."check:oxlint"]
run = "oxlint --deny-warnings apps/*/web templates/*/web ui vite.config.ts"

[tasks.fmt]
depends = ["fmt:mise", "fmt:oxfmt"]

[tasks.test]
run = "node --test"
